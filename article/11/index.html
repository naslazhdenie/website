<h1>C70型敞车</h1>
<div class="text">
<p>C70型通用敞车，载重70t、轴重23t。主要用于装运煤炭、矿石、机械设备、建材、钢材、木材等货物。首辆样车于2005年3月在齐齐哈尔车辆公司下线，并于同年6月通过了部级技术审查。</p>
